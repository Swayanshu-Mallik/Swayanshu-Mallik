<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Swayanshu Mallik - Engineer portfolio banner">
<defs>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#393E46" stroke-width="1"/>
  <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="10s" repeatCount="indefinite"/>
 </pattern>
 <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#DFD0B8" stop-opacity=".55"/><stop offset=".5" stop-color="#DFD0B8" stop-opacity=".08"/><stop offset="1" stop-color="#948979" stop-opacity=".45"/>
 </linearGradient>
 <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#DFD0B8" stop-opacity="0"/><stop offset=".5" stop-color="#DFD0B8" stop-opacity=".10"/><stop offset="1" stop-color="#DFD0B8" stop-opacity="0"/>
 </linearGradient>
 <clipPath id="panel"><rect x="30" y="30" width="840" height="260" rx="26"/></clipPath>
</defs>
<style>
 .r{opacity:0;animation:cyc 9s infinite} .r2{animation-delay:3s} .r3{animation-delay:6s}
 @keyframes cyc{0%{opacity:0;transform:translateY(10px)}5%,28%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}
 .cur{animation:blink 1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
 .pulse{stroke-dasharray:14 190;animation:flow 4s linear infinite} @keyframes flow{to{stroke-dashoffset:-408}}
 @media (prefers-reduced-motion: reduce){*{animation:none!important} .r1{opacity:1}}
</style>
<rect width="900" height="320" rx="30" fill="#222831"/>
<rect width="900" height="320" rx="30" fill="url(#grid)" opacity=".55"/>
<circle cx="170" cy="90" r="95" fill="#948979" opacity=".40" filter="url(#blur)"><animate attributeName="cx" values="170;260;170" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="90;130;90" dur="12s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="250" r="110" fill="#DFD0B8" opacity=".16" filter="url(#blur)"><animate attributeName="cx" values="760;690;760" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="520" cy="40" r="70" fill="#393E46" opacity=".9" filter="url(#blur)"/>
<rect x="30" y="30" width="840" height="260" rx="26" fill="#DFD0B8" fill-opacity=".07" stroke="url(#edge)" stroke-width="1.4"/>
<g clip-path="url(#panel)"><rect x="-300" y="30" width="260" height="260" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" values="-300;1100" dur="7s" repeatCount="indefinite"/></rect></g>
